<script>
// (c) Copyright 2025 Hermann Paul von Borries. All rights reserved.
// MIT License

let pageHeader = new PageHeader().setTitle( tlt("Historia"), "BACK" );


async function getHistory( ) {
    // Don't use cached version here, we need to show history up-to-date.
	let histlist = await fetch_json( "/data/history.json" ) ;
    // sort by timestamp 
    histlist.sort( (a,b)=>(b[1]-a[1]) );
	let s = "" ;
    let previous_date = "";
    let body = document.getElementById( "historyBody" );
    body.innerHTML = "";
    let i = 0;
    let multipleSetlists = await isMultipleSetlistsEnabled();
    let tunelib = await tunelibCache.get();

    for( let hist_element of histlist){
        // 0 tuneid
        // 1 date in seconds since 2000/1/1 (ESP32 epoch)
        // 2 percentage
        // 3 formerly: user request, now: repeat count

        // Convert date from seconds in ESP32 epoch to string
        // date: yyyy-mm-dd, time: hh:mm
        let datetime = ymdhm( hist_element[1] );
        const [date, time] = datetime.split(" ");

        // Insert separator row with date when date changes
        if( date != previous_date) {
            let row = insertRow( body, [date, "", ""]);
            row.cells[0].colSpan = 2;
            row.cells[0].style.fontWeight="bold";
            let deleteDay = document.createElement("button");
            deleteDay.innerText = "🗑️";
            deleteDay.onclick = ()=>{deleteHistoryDate(date)};
            deleteDay.name = "deleteButtons";
            row.cells[1].appendChild( deleteDay );
         };
        previous_date = date ;
        // Formerly hist_element[3] was used to mark if tune was requested via web site, but this is no longer used.
        // Now it's the repeat count
        // Mark if tune has been requested via web site
        //let user_request = "" ;
        //if( hist_element[3] ) {
            // user request
        //    user_request = "✔️" ; // check mark &#x2714;
        //}
        let row = insertRow( body, [time, "", ""]);

        // Get title (if still in tunelib...)
        let tuneid = hist_element[0];
    	let tune = tunelib[tuneid]; // may be undefined if tune was deleted
        if( tune != undefined ){
            let tuneTitle = document.createElement( "span", {"is":"tune-title"});
            // format "hpt%msd"
            // We are calling isMultipleSetlistsEnabled() here, so menu only appears if needed.
            tuneTitle.setTune( tune, { beforeFormat:"hpt", afterFormat:"ms", shortClick:true, menu:multipleSetlists } );
            row.cells[1].appendChild( tuneTitle );
            row.cells[2].innerHTML = await make_history_percentage(  tune, hist_element[2], hist_element[3] );
        }
        else{
            let tuneTitle = document.createElement( "span" );
            tuneTitle.innerText = tlt("(borrado)");
            row.cells[1].appendChild( tuneTitle );
        }
        
        i += 1;
    }
    commonGetProgress.setSleep( 2_000 );
    commonGetProgress.registerCallback( (progress)=>TuneTitle.updateProgress( progress ) );
    commonGetProgress.registerCallback( updateButtons );
    JsonCache.setReloadIfTunelibChanged(true);
    commonGetProgress.startBackground();
}

async function updateButtons( progress ){
    // disable slow buttons during playback
	for( const button of document.getElementsByName("deleteButtons")){
        button.disabled =  progress["status"] == "playing";
	}
}

async function deleteHistory(){
    // Purge old elements from history
	let days = parseInt( document.getElementById("days").value );
    if( isNaN(days) ){
        showPopup(document.getElementById("days"), "must be numeric" );
        return;
    }
	resp = await fetch_json( "/delete_history/" + days ) ;
    showPopup("", tlt("Historia truncada") ); 
    await sleep_ms(1000);
    window.location.reload() ;
}

async function make_history_percentage( tune, percentage, repeat_count ){
    let text = "";
    // cases
    // percentage = 100, repeat_count = 1:    2:30 = 100%
    // percentage < 100, repeat_count = 1:    0:24 = 30%
    // percentage = 100, repeat_count > 1:    5:00 = 2×
    // percentage < 100, repeat_count > 1:    5:00 = 2×+30%
    if( tune != undefined ){
        // Deal with old records previous to change including repeat_count
        if( repeat_count == 0 || repeat_count == ""){
            repeat_count = 1;
        }
        let timesPlayed = 0;
        let formattedRepeats = "";
        if( percentage == 100 ){
            timesPlayed = repeat_count;
            if( repeat_count == 1 ){
                formattedRepeats = `100%`;
            }
            else{
                formattedRepeats = `${repeat_count}×`;
            }
        }
        else{ // percentage < 100
            timesPlayed = repeat_count-1 + percentage/100;
            if( repeat_count == 1 ){
                formattedRepeats = `${percentage}%`;
            }
            else{
                formattedRepeats = `${repeat_count-1}×+${percentage}%`;
            }
        }
        let fulltime = formatMilliMMSS( Math.round(tune[TLCOL_TIME]*timesPlayed ));
        text = fulltime + " = " + formattedRepeats;
    }
    return text ;
}

async function deleteHistoryDate( date ){
    if( confirm( tlt("Borrar historia de") + " " + date + " ?") ){
        let resp = await fetch_json( "/delete_history_date/" + date ) ;
        showPopup("", tlt("Historia truncada") ); 
        await sleep_ms(1000);
        window.location.reload() ;
    }
}
translate_html() ;
getHistory() ;



</script>
