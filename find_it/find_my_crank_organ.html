<script>

let MCS_UUID = 0x1848 ; //Media Control Service
// Some private characteristics
_CHARACTERISTIC_UUIDS = [
    "2a7c3e29-62f9-47bf-8b00-69db8c3c88f1",
    "49f99c64-b2c8-40de-a944-ea4fd48b497a",
    "1732b3cb-c879-4157-a106-65d38cac591b",
    "c9eb91e8-03ca-4739-a774-8fbee561caee",
    "98bfa6b0-55fc-4197-905e-635d68e58bf6",
    "35dcf9be-89be-404b-bb7f-61dde7160e96",
    "b17957bc-c797-470c-b844-6015c9f7f390"
    // pending: add MCS UUIDs
];
_CHARACTERISTIC_NAMES = [ "stassid1", "stassid2", "apssid", "staip1", "staip2",  "apip", "status"];
    

function log( s ){
    let result = document.getElementById("result");
    if( s == "new"){
        result.innerText = "";
        return ;
    }
    result.innerHTML = result.innerHTML + s + "<br>";
}
// future use?
async function sleep_ms( t ){
	await new Promise(r => setTimeout(r, t));
}
    
async function getCharacteristicString( service, uuid ){
    let characteristic = await service.getCharacteristic(uuid);
    let value = await characteristic.readValue()
    return new TextDecoder().decode(value);
}

async function scan(){
    log("new");
    let btinfo = await getBtInfo();
    let d = new Date();
    log("Information date/time " + d.toLocaleDateString() + " " + d.toLocaleTimeString()    );
    for( k in btinfo ){
        log(k+": "+btinfo[k]);
    }
    let sta_texto = document.getElementById("sta_texto");
    let sta_link = document.getElementById("sta_link");
    let ap_texto = document.getElementById("ap_texto");
    let ap_link = document.getElementById("ap_link");
    sta_texto.innerText = "";
    sta_link.innerText = "";
    sta_link.href = "";
    ap_texto.innerText = "";
    ap_link.innerText = "";
    ap_link.href = "";
    
    for( const[sta,other] of [["1","2"], ["2","1"]]){
        let status = btinfo["stastatus" + sta]  ;
        let ssid = btinfo["stassid" + sta];
        if( ssid == "" || status == "n"){
            continue;
        }
        let ssid_other = btinfo["stassid" + other];
        let staip = btinfo["staip" + sta];
        if( status == "b"){
            sta_texto.innerHTML = `The crank organ is trying to connect to the WiFi network <b>${ssid}</b>. Check that that network is active and near by. `;
            if( ssid_other != "" ){
                 sta_texto.innerHTML +=`If this doesn't work, the crank organ will automatically try to connect to the WiFi network<b>${ssid_other}</b>. `;
            }
            sta_texto.innerHTML += " Try again.";
        }
        else if( status == "c" ){
            sta_texto.innerHTML = `The crank organ is now connected to the WiFi network <b>${ssid}</b>. Check that your cell phone offers that netork as hotspot, or that your cell phone or PC is connected to that netowkr. If that is the case, click `;
            sta_link.innerText = "here to navigate to the crank organ";
            sta_link.href = "http://" + staip + "/";
            break;
        }
        // Ignore status == "n"
        
    }
    if( btinfo["apssid"] == undefined){
        sta_texto.innerHTML = "Try again.";
        return;
    }
    let ssid1 = "<b>" + btinfo["stassid1"] + "</b>";
    let ssid2 = "<b>" + btinfo["stassid2"] + "</b>";
    if( ssid1 == "<b></b>" ){
        ssid1 = "(network 1 not defined)";
    }
    if( ssid2 == "<b></b>" ){
        ssid2 = "(network 2 not defined)";
    }
    
    if( sta_texto.innerText == ""){
        sta_texto.innerHTML = `None of the WiFi networks ${ssid1} o ${ssid2} are active nor visible. Try again.`;
    }
    if( btinfo["apstatus"] == "a" ){
        let apip = btinfo["apip"];
        let apssid = btinfo["apssid"];
        
        ap_texto.innerHTML = `If there is no way to connect with ${ssid1} nor ${ssid2}, you can connect to the crank organ's own network <b>${apssid}</b>. Once connected, click `;
        ap_link.innerText = "here to navigate to the crank organ";
        ap_link.href = "http://" + apip + "/";
    }
    else {
        ap_texto.innerHTML = "The crank organ's own network is not available.";
    }
}
    
async function getBtInfo(){
    let options = {}
    options.filters = [ {services:[MCS_UUID]} ];
    //options.acceptAllDevices = true;
    options.optionalServices = [MCS_UUID];
    let btinfo = {};
    if( !navigator.bluetooth ){
        alert("This browser doesn't support bluetooth, use Chrome");
        return btinfo;
    }
    log("Waiting for bluetooth" );
    try{
        let device = await navigator.bluetooth.requestDevice(options);
        console.log("device ", device);
        btinfo.device_name = device.name;
        let server = await device.gatt.connect();
        console.log("server", server);
        let service = await server.getPrimaryService(MCS_UUID);
        console.log("service", service);

        for( i = 0; i < _CHARACTERISTIC_UUIDS.length; i++){
            let value = await getCharacteristicString( service, _CHARACTERISTIC_UUIDS[i]);
            btinfo[ _CHARACTERISTIC_NAMES[i]] = value;
        }
        let status = btinfo["status"];
        btinfo["stastatus1"] = status[0];
        btinfo["stastatus2"] = status[1];
        btinfo["apstatus"] = status[2];
        console.log("btinfo", btinfo);
        server.disconnect();
    }
    catch(e){
        log("There is a problem connecting via bluetooth"+e);
        alert("There is a problem connecting via bluetooth");
    }
    return btinfo;
}

</script>
